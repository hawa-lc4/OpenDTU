
[env:my_esp32_sz-openCB-v6]
board = esp32dev
build_flags = ${env.build_flags}
    -DHOYMILES_PIN_MISO=GPIO_NUM_19
    -DHOYMILES_PIN_MOSI=GPIO_NUM_23
    -DHOYMILES_PIN_SCLK=GPIO_NUM_18
    -DHOYMILES_PIN_IRQ=GPIO_NUM_16
    -DHOYMILES_PIN_CE=GPIO_NUM_4
    -DHOYMILES_PIN_CS=GPIO_NUM_5
    -DLED0=GPIO_NUM_33
    -DLED1=GPIO_NUM_25
    -DCMT_CLK=GPIO_NUM_12
    -DCMT_CS=GPIO_NUM_27
    -DCMT_FCS=GPIO_NUM_26
    -DCMT_SDIO=GPIO_NUM_14
    -DCMT_GPIO2=GPIO_NUM_NC
    -DCMT_GPIO3=GPIO_NUM_NC
monitor_port = COM3
upload_port = COM3


